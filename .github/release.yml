# Categories for automatically generated release notes (used by the Release workflow).
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🔒 Security
      labels: [security]
    - title: ✨ Features
      labels: [feature, enhancement]
    - title: 🐛 Fixes
      labels: [bug, fix]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: 🧰 Maintenance
      labels: ["*"]
