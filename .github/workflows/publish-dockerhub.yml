name: Publish Images to Docker Hub

# Builds the production image in GitHub Actions and pushes it to Docker Hub.
#   push to main      → :edge and :sha-<commit>                  (linux/amd64)
#   release vX.Y.Z    → :X.Y.Z, :X.Y, :X, :latest, :sha-<commit>  (linux/amd64 + linux/arm64)
#
# Secrets: DOCKERHUB_USERNAME (may also be a repository variable)
#          DOCKERHUB_TOKEN    (Docker Hub access token — a password also works)

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!tests/**"
      - "!scripts/**"
      - "!action.yml"
      - "!.github/**"
      - ".github/workflows/publish-dockerhub.yml"
  workflow_call:
    inputs:
      version:
        description: Release version (vX.Y.Z) to tag the image with
        type: string
        required: false
        default: ""
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Release version to tag (e.g. v1.2.0). Leave empty for an edge/SHA build.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-dockerhub-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: apparelflow-erp

jobs:
  publish:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Resolve image, tags and platforms
        id: config
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning title=Docker Hub publish skipped::Add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish images."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}"
          release=false
          stable=false
          platforms="linux/amd64"
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error title=Invalid version::'$VERSION' is not a semantic version such as v1.2.3"
              exit 1
            fi
            release=true
            platforms="linux/amd64,linux/arm64"
            if [[ "$VERSION" != *-* ]]; then stable=true; fi
          fi
          {
            echo "ready=true"
            echo "image=$image"
            echo "release=$release"
            echo "stable=$stable"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up QEMU (multi-arch release builds)
        if: steps.config.outputs.ready == 'true' && steps.config.outputs.release == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.config.outputs.ready == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.config.outputs.ready == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        if: steps.config.outputs.ready == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.config.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ steps.config.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ steps.config.outputs.release }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ steps.config.outputs.release }}
            type=raw,value=latest,enable=${{ steps.config.outputs.stable }}
            type=edge,branch=main,enable=${{ steps.config.outputs.release == 'false' }}
            type=sha
          labels: |
            org.opencontainers.image.title=ApparelFlow ERP
            org.opencontainers.image.description=Cutting Operations & Gatekeeper Verification Terminal (Next.js + PostgreSQL)
            org.opencontainers.image.vendor=ApparelFlow

      - name: Build & push
        id: build
        if: steps.config.outputs.ready == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.config.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=apparelflow-erp
          cache-to: type=gha,mode=max,scope=apparelflow-erp
          provenance: mode=max
          sbom: true

      - name: Summary
        if: steps.config.outputs.ready == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ steps.config.outputs.platforms }}
        run: |
          {
            echo "### 🐳 Published to Docker Hub"
            echo ""
            echo "**Digest:** \`$DIGEST\`  ·  **Platforms:** $PLATFORMS"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
