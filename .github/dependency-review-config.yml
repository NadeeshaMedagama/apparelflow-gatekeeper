# Policy for actions/dependency-review-action (see .github/workflows/dependency-review.yml).

# Fail on newly introduced vulnerabilities of this severity or worse.
fail-on-severity: moderate
# Vulnerabilities in dev tooling count too: they run in CI with access to secrets.
fail-on-scopes:
  - runtime
  - development

# Licenses currently present in the dependency tree. Weak-copyleft licenses
# (MPL-2.0: axe-core, lightningcss; LGPL-3.0-or-later: sharp's optional libvips
# binaries, dynamically linked) are acceptable for a hosted application.
allow-licenses:
  - MIT
  - Apache-2.0
  - ISC
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - BlueOak-1.0.0
  - CC0-1.0
  - CC-BY-4.0
  - Python-2.0
  - Unlicense
  - MPL-2.0
  - LGPL-3.0-or-later

comment-summary-in-pr: on-failure
